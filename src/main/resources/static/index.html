<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Doc Searcher</title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            overflow: hidden;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #1f2933;
            background: #3a1217;
        }

        .background-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .background-scene::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.32);
        }

        #backgroundImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100dvh;
            transform: translate3d(0, 0, 0);
            transform-origin: top center;
            will-change: transform;
        }

        .page {
            position: relative;
            box-sizing: border-box;
            width: min(1180px, calc(100% - 28px));
            height: 100dvh;
            margin: 0 auto;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-box {
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        h1 {
            display: none;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        #query {
            flex: 1;
            height: 52px;
            padding: 0 14px;
            border: 2px solid rgba(17, 24, 39, 0.86);
            border-radius: 8px;
            font-size: 22px;
            color: #111827;
            background: rgba(255, 255, 255, 0.92);
            outline: none;
            box-sizing: border-box;
        }

        #query:focus {
            border-color: #1f6fd1;
            background: rgba(255, 255, 255, 0.98);
        }

        #searchBtn {
            width: 118px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: #196fca;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.18s ease, background-color 0.18s ease;
        }

        #searchBtn:hover {
            background: #155da9;
        }

        #searchBtn:active {
            transform: translateY(1px);
        }

        #searchBtn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .status {
            min-height: 20px;
            margin-top: 8px;
            color: #26384d;
            font-size: 14px;
            font-weight: 600;
        }

        .result-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 14px 22px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.48);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(2px);
            scrollbar-gutter: stable;
        }

        .result-list::-webkit-scrollbar {
            width: 12px;
        }

        .result-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.34);
            border-radius: 999px;
        }

        .result-list::-webkit-scrollbar-thumb {
            background: rgba(25, 111, 202, 0.72);
            border: 3px solid rgba(255, 255, 255, 0.46);
            border-radius: 999px;
        }

        .result-item {
            padding: 12px 0 18px;
            border-bottom: 1px solid rgba(31, 41, 55, 0.16);
            background: transparent;
        }

        .result-item:first-child {
            padding-top: 0;
        }

        .result-title {
            display: block;
            margin: 0 0 6px;
            color: #1268bd;
            font-size: 25px;
            line-height: 1.25;
            font-weight: 700;
            text-decoration: underline;
        }

        .result-url {
            display: block;
            margin-top: 6px;
            color: #16833c;
            font-size: 20px;
            line-height: 1.3;
            word-break: break-all;
        }

        .result-desc {
            margin: 0;
            color: #111827;
            font-size: 21px;
            line-height: 1.42;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.42);
        }

        .result-desc i {
            color: #d0182f;
            font-style: normal;
            font-weight: 800;
            background: rgba(255, 230, 105, 0.34);
            border-radius: 3px;
            padding: 0 2px;
        }

        .empty-text {
            padding: 28px 4px;
            color: #26384d;
            font-size: 18px;
            font-weight: 600;
        }

        @media (max-width: 720px) {
            body {
                overflow: auto;
            }

            .page {
                height: 100dvh;
                width: calc(100% - 16px);
                padding: 8px 0;
            }

            .form-row {
                gap: 8px;
            }

            #query {
                height: 46px;
                font-size: 18px;
            }

            #searchBtn {
                width: 86px;
                font-size: 18px;
            }

            .result-list {
                padding: 10px 10px 18px;
            }

            .result-title {
                font-size: 21px;
            }

            .result-desc,
            .result-url {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
<div class="background-scene">
    <img id="backgroundImage" src="image/search-bg.jpg" alt="">
</div>

<div class="page">
    <div class="search-box">
        <h1>Java 文档搜索</h1>
        <div class="form-row">
            <input id="query" type="text" placeholder="请输入要查找的内容..." autocomplete="off">
            <button id="searchBtn" type="button">搜索</button>
        </div>
        <div id="status" class="status"></div>
    </div>

    <div id="results" class="result-list"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
